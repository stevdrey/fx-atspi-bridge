name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 27
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: '27'
      - name: Install GLib for native unit tests, AT-SPI Python bindings for the probe tests, and Xvfb/GTK for the JavaFX toolkit tests
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-0t64 python3-gi gir1.2-atspi-2.0 xvfb libgtk-3-0t64
      - name: Check JDK
        run: java -version
      - name: Build library and example; test native variants, Unicode offsets and the JavaFX scene model
        env:
          REQUIRE_FX_TOOLKIT: '1'  # fail instead of skipping the JavaFX toolkit tests when no display/toolkit is available
        run: xvfb-run -a ./gradlew check generatePomFileForMavenJavaPublication --no-daemon
      - name: Test baseline tooling
        env:
          REQUIRE_ATSPI_TESTS: '1'  # fail instead of skipping the probe suite when the bindings are missing
        run: python3 -m unittest discover -s examples/fx-lab/scripts -p 'test_*.py'
