plugins { id 'application' }
repositories { mavenCentral() }
java { toolchain { languageVersion = JavaLanguageVersion.of(27) } }
dependencies { implementation project(':') }
application {
    mainModule = 'dev.desktopcontrol.fxlab'
    mainClass = 'dev.desktopcontrol.fxlab.Launcher'
    applicationDefaultJvmArgs = ['--enable-native-access=dev.desktopcontrol.fxatspi,javafx.graphics', '-XX:+ExitOnOutOfMemoryError']
}
