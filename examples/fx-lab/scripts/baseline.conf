# Shared limits of the SC-01 harness. Single source of truth, read by BenchApp (--limits=), budgets.py and the tests.
# KEY=VALUE only (valid Java .properties, bash and Python).

# A ~1 Hz throttled display (blanked/locked screen) yields ~1000 ms pulses; any measured pulse at or above this invalidates a run.
MAX_VALID_PULSE_MS=900
# Median idle pulse (no bridge) above this at startup means a throttled display.
MAX_CADENCE_MS=50
# Structural churn: a cycle is 3 pulse waits plus 0.75 s of holds. Throttled to 1 Hz it takes >= 3.75 s; the slowest legitimate
# cell (10,000 nodes with the bridge) took 2.39 s. 3.5 s leaves 46 % margin over legitimate data and stays below the throttled floor.
MAX_STRUCTURAL_S_PER_CYCLE=3.5
