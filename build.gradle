plugins {
    id 'java-library'
    id 'maven-publish'
}
group = 'io.github.stevdrey'
version = '0.1.0-SNAPSHOT'
def javafxVersion = '27'
repositories { mavenCentral() }
java {
    toolchain { languageVersion = JavaLanguageVersion.of(27) }
    withSourcesJar()
    withJavadocJar()
}
dependencies {
    for (component in ['base', 'graphics', 'controls']) {
        api("org.openjfx:javafx-${component}:${javafxVersion}:linux") { transitive = false }
    }
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}
tasks.withType(Jar).configureEach {
    from(rootProject.projectDir) {
        include 'LICENSE', 'NOTICE', 'THIRD_PARTY_NOTICES.md'
        into 'META-INF'
    }
}
publishing {
    repositories { maven { name = 'Qa'; url = layout.buildDirectory.dir('qa-repository') } }
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = 'fx-atspi-bridge'
                description = 'Experimental JavaFX accessibility bridge for Linux AT-SPI2, using Java FFM.'
                url = 'https://github.com/stevdrey/fx-atspi-bridge'
                licenses {
                    license {
                        name = 'Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                        distribution = 'repo'
                    }
                }
                developers { developer { id = 'stevdrey'; name = 'Steven Rey Sequeira' } }
                scm {
                    connection = 'scm:git:https://github.com/stevdrey/fx-atspi-bridge.git'
                    developerConnection = 'scm:git:ssh://git@github.com/stevdrey/fx-atspi-bridge.git'
                    url = 'https://github.com/stevdrey/fx-atspi-bridge'
                }
            }
        }
    }
}

def qaRepository = layout.buildDirectory.dir('qa-repository')
// Keep exactly one publication: snapshot timestamps would otherwise accumulate on every check.
tasks.named('publishMavenJavaPublicationToQaRepository') { doFirst { qaRepository.get().asFile.deleteDir() } }

// Resolve the publication from two independent consumer builds, never project(':').
tasks.register('verifyConsumerIntegration', Exec) {
    dependsOn 'publishMavenJavaPublicationToQaRepository'
    // Up to date while the published content is unchanged; qualification.py still forces it with --rerun-tasks.
    inputs.files(tasks.named('jar'), tasks.named('sourcesJar'), tasks.named('javadocJar'),
            tasks.named('generatePomFileForMavenJavaPublication'), tasks.named('generateMetadataFileForMavenJavaPublication'))
            .withPropertyName('publication')
    // The nested build keeps its own .gradle state there; only consumer sources are inputs.
    inputs.files(fileTree('qa/consumers') { exclude '.gradle/**', 'build/**' }).withPropertyName('consumers')
    inputs.files('examples/fx-lab/scripts/consumer_check.py', 'examples/fx-lab/scripts/qa_common.py',
            'examples/fx-lab/scripts/scaling_audit.py').withPropertyName('scripts')
    inputs.property('versions', "${version}:${javafxVersion}")
    outputs.file(layout.buildDirectory.file('consumer-qa/artifacts.json'))
    commandLine 'python3', 'examples/fx-lab/scripts/consumer_check.py', projectDir, version, javafxVersion
}
tasks.named('check') { dependsOn 'verifyConsumerIntegration' }
