plugins {
    id 'java-library'
    id 'maven-publish'
}
group = 'io.github.stevdrey'
version = '0.1.0-SNAPSHOT'
repositories { mavenCentral() }
java {
    toolchain { languageVersion = JavaLanguageVersion.of(27) }
    withSourcesJar()
    withJavadocJar()
}
dependencies {
    for (component in ['base', 'graphics', 'controls']) {
        api("org.openjfx:javafx-${component}:27:linux") { transitive = false }
    }
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}
tasks.withType(Jar).configureEach {
    from(rootProject.projectDir) {
        include 'LICENSE', 'NOTICE', 'THIRD_PARTY_NOTICES.md'
        into 'META-INF'
    }
}
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = 'fx-atspi-bridge'
                description = 'Experimental JavaFX accessibility bridge for Linux AT-SPI2, using Java FFM.'
                url = 'https://github.com/stevdrey/fx-atspi-bridge'
                licenses {
                    license {
                        name = 'Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                        distribution = 'repo'
                    }
                }
                developers { developer { id = 'stevdrey'; name = 'Steven Rey Sequeira' } }
                scm {
                    connection = 'scm:git:https://github.com/stevdrey/fx-atspi-bridge.git'
                    developerConnection = 'scm:git:ssh://git@github.com/stevdrey/fx-atspi-bridge.git'
                    url = 'https://github.com/stevdrey/fx-atspi-bridge'
                }
            }
        }
    }
}
